# Credenciales acceso BBDD #

spring.datasource.url=jdbc:postgresql://localhost:5432/speedkitchen
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA e Hibernate #

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Establecemos el esquema por defecto para no tener que anotarlo en cada entidad #

spring.jpa.properties.hibernate.default_schema=speedkitchen

# 'validate' comprueba que las entidades Java coincidan con tu script SQL sin sobreescribir las tablas #

spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL en consola #

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true